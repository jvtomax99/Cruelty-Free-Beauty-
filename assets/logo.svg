<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 150 880 880" role="img" aria-label="C.F.B. bunny in a tiara and cape, hugging a lipstick">
  <title>C.F.B. bunny</title>
  <!-- Drawn for C.F.B. Every part has an id: intro.js animates them one by one. -->
  <defs>
    <path id="heart" d="M0 12C-6 6-22-3-22-15c0-8 6-13 12-13 5 0 8 3 10 6 2-3 5-6 10-6 6 0 12 5 12 13C22-3 6 6 0 12z"/>
  </defs>
  <g id="hearts" fill="#F8D6DB">
    <use href="#heart" transform="translate(880 350) scale(1.5)"/>
    <use href="#heart" transform="translate(905 448) scale(1.3)" opacity=".55"/>
    <use href="#heart" transform="translate(985 512) scale(1.1)"/>
    <use href="#heart" transform="translate(300 446) scale(.9)"/>
    <use href="#heart" transform="translate(228 570) scale(1.3)"/>
    <use href="#heart" transform="translate(250 632) scale(.95)" opacity=".55"/>
    <use href="#heart" transform="translate(990 660) scale(.8)" opacity=".7"/>
  </g>
  <ellipse id="shadow" cx="590" cy="968" rx="350" ry="44" fill="#EFA3AE"/>
  <g id="bunny" stroke="#DB6B7E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <g id="cape" stroke="#3E3537" stroke-width="13">
      <path fill="#F6C4CC" d="M432 650C372 720 318 800 268 902C330 930 400 946 470 940H720C790 948 866 936 928 912C872 806 812 722 748 650Z"/>
      <path fill="none" stroke="#EFA3AE" stroke-width="8" d="M318 846Q350 880 348 918M872 852Q846 884 850 922"/>
    </g>
    <g id="ears">
      <g id="ear-l"><rect x="420" y="190" width="124" height="320" rx="62" transform="rotate(-4 482 350)" fill="#FFFDFC"/>
        <rect x="455" y="260" width="58" height="220" rx="29" transform="rotate(-4 482 350)" fill="#F8D6DB" stroke="none"/></g>
      <g id="ear-r"><rect x="638" y="190" width="124" height="320" rx="62" transform="rotate(4 700 350)" fill="#FFFDFC"/>
        <rect x="671" y="260" width="58" height="220" rx="29" transform="rotate(4 700 350)" fill="#F8D6DB" stroke="none"/></g>
    </g>
    <g id="feet">
      <g id="foot-l"><ellipse cx="398" cy="900" rx="78" ry="64" fill="#FFFDFC"/><ellipse cx="368" cy="902" rx="30" ry="40" fill="#F8D6DB" stroke="none"/></g>
      <g id="foot-r"><ellipse cx="782" cy="900" rx="78" ry="64" fill="#FFFDFC"/><ellipse cx="812" cy="902" rx="30" ry="40" fill="#F8D6DB" stroke="none"/></g>
    </g>
    <path id="body" fill="#FFFDFC" d="M590 440C702 440 772 518 777 620C781 700 800 760 804 830C810 906 772 962 700 966H480C408 962 370 906 376 830C380 760 399 700 403 620C408 518 478 440 590 440Z"/>
    <g id="tiara" stroke="#C99A3A" stroke-width="7" fill="#FFFDFC">
      <path fill="none" stroke-width="9" d="M524 466Q590 440 656 466"/>
      <circle cx="541" cy="446" r="12"/><circle cx="564" cy="434" r="14"/><circle cx="616" cy="434" r="14"/><circle cx="639" cy="446" r="12"/>
      <circle cx="590" cy="424" r="18"/>
    </g>
    <g id="collar" fill="none">
      <path stroke="#3E3537" stroke-width="30" d="M410 676Q590 764 770 676"/>
      <path stroke="#F6C4CC" stroke-width="15" d="M410 676Q590 764 770 676"/>
    </g>
    <g id="face">
      <g id="cheeks" fill="#F6B3BD" stroke="none"><ellipse cx="468" cy="650" rx="27" ry="15"/><ellipse cx="712" cy="650" rx="27" ry="15"/></g>
      <path id="eye-l" fill="none" d="M466 614Q497 580 528 614"/>
      <path id="eye-r" fill="none" d="M652 614Q683 580 714 614"/>
      <path id="mouth" fill="none" stroke-width="15" d="M562 646Q576 666 590 648Q604 666 618 646"/>
    </g>
    <g id="lipstick" transform="translate(515 928) rotate(39) translate(0 -300)" stroke="none">
      <g id="bullet"><path d="M-40 -18V-142L40 -192V-18Z" fill="#EE8E9C"/><path d="M-40 -142L40 -192V-170L-40 -120Z" fill="#F6AEB8"/><rect x="-28" y="-128" width="12" height="104" rx="6" fill="#F8C1C9"/></g>
      <rect x="-50" y="-30" width="100" height="40" rx="8" fill="#3E3537"/>
      <rect id="tube" x="-56" y="0" width="112" height="300" rx="20" fill="#504548"/>
      <rect x="-40" y="22" width="12" height="256" rx="6" fill="#6E6265"/>
    </g>
    <use id="clasp" href="#heart" transform="translate(578 738) scale(1.35)" fill="#EE8E9C" stroke="#3E3537" stroke-width="6"/>
    <g id="paws" fill="#FFFDFC">
      <path id="paw-l" d="M418 812C452 842 510 846 548 822"/>
      <path id="paw-r" d="M632 822C672 846 724 842 762 812"/>
    </g>
  </g>
</svg>
