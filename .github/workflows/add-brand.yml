# The founder's "Add a brand" requests. Her Add a brand box (founder.js) opens a GitHub issue
# labelled add-brand; this checks PETA and Leaping Bunny and adds the brand to the live app
# with its proof (tools/process-brand-requests.cjs says exactly what it does). It acts only on
# issues opened by the trusted logins listed in that script (CLAUDE.md). Runs when such an
# issue is opened, once a day as a retry for lookups that failed, and by hand.
name: Add a brand

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # A push made with this workflow's token doesn't start a Pages build on its own (GitHub's Pages
  # docs), so the script asks for one after pushing.
  pages: write

# One run at a time, so two requests never write data/brands.json at once.
concurrency:
  group: add-brand
  cancel-in-progress: false

jobs:
  add:
    # Issue events only from trusted logins and with the label; the script checks again.
    if: >-
      github.event_name != 'issues' ||
      (contains(github.event.issue.labels.*.name, 'add-brand') &&
       contains(fromJSON('["jvtomax99","cfbbeauty"]'), github.event.issue.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Check the requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "C.F.B. brand check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/process-brand-requests.cjs
