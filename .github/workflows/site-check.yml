# Checks the site on every pull request before it can go live (merging to
# main is going live on GitHub Pages): no missing files, no links starting
# with "/", and every page opens at phone and desktop width with no script
# error. The check itself is .github/site-check.cjs.
name: Site check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: Playwright 1.56.1 can't install its browser on Ubuntu 26.04,
    # which ubuntu-latest became in November 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          # The extra system packages (mostly fonts) come from Ubuntu's servers,
          # which the runner sometimes can't reach (2026-11-11: two pull
          # requests failed on it). Give that 3 minutes, then install the
          # browser alone: the runner image already has what Chromium needs,
          # and if it didn't, the check below would fail to open the page.
          timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Check the site
        run: node .github/site-check.cjs index.html
