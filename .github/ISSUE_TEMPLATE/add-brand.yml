# The founder's "Add a brand" box (founder.js) opens this form filled in.
# The Add a brand GitHub Action (.github/workflows/add-brand.yml) handles these,
# only from the trusted logins in CLAUDE.md: it checks PETA, Leaping Bunny and Cruelty Free International,
# adds the brand with its proof, and answers on the issue.
name: Add a brand
description: Ask for a cruelty-free brand to be checked and added to C.F.B.
title: "Add brand: "
labels: ["add-brand"]
body:
  - type: markdown
    attributes:
      value: |
        We check PETA, Leaping Bunny and Cruelty Free International and add the brand with the proof. If none of them lists it, it stays out and we say why here.
  - type: input
    id: brand
    attributes:
      label: Brand name
      placeholder: Milani
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Brand's website (if you have it)
      placeholder: https://
  - type: input
    id: proof
    attributes:
      label: Certifier page, from PETA, Leaping Bunny or Cruelty Free International (if you have it)
      placeholder: https://
  - type: markdown
    attributes:
      value: |
        **More details (optional).** Each one is saved only if its link shows it. Comments below aren't read by the check, so put details in these boxes.
  - type: input
    id: parent
    attributes:
      label: Parent company (who owns the brand)
      placeholder: L'Oréal
  - type: input
    id: parent_link
    attributes:
      label: Link that shows who owns it
      description: A page from the owner, the brand or a certifier that names both.
      placeholder: https://
  - type: input
    id: china
    attributes:
      label: Sold in mainland China stores? (yes or no)
      placeholder: yes
  - type: input
    id: china_link
    attributes:
      label: Link that shows where it sells
      placeholder: https://
  - type: input
    id: price
    attributes:
      label: Price ($ drugstore, $$ mid, $$$ luxury)
      placeholder: $
  - type: input
    id: store
    attributes:
      label: A store that carries it
      placeholder: Ulta
  - type: input
    id: store_link
    attributes:
      label: Store link (the brand's page at that store)
      placeholder: https://
